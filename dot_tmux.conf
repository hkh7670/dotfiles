# ~/.tmux.conf
# ════════════════════════════════════════════════════════════

# ── Prefix: Ctrl+b → Ctrl+a ─────────────────────────────────
set -g prefix C-a
unbind C-b
# prefix + C-a 로 리터럴 Ctrl-A 전송 (중첩 tmux, 셸의 beginning-of-line 등)
bind C-a send-prefix

# ── 기본 환경 ────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# 트루컬러(*:RGB)와 확장키(extkeys)를 tmux 기본 terminal-features에 더해 한 번에 지정.
# -a(append)로 붙이면 설정을 리로드할 때마다 같은 항목이 계속 누적되므로 -g로 전체를 명시한다.
# 앞쪽 3개 항목은 tmux 기본값 — 특히 clipboard는 OSC 52 복사에 필요하므로 반드시 유지.
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,screen*:title,rxvt*:ignorefkeys,*:RGB'

# escape-time을 0에 가깝게: vim/nvim, Claude Code TUI의 입력 지연/깜빡임 방지
set -sg escape-time 10
set -g repeat-time 300

# 포커스 이벤트 전달: Claude Code, nvim 등이 pane 포커스를 인식하게 함
set -g focus-events on

# 확장 키(Shift+Enter 등 조합키 구분) 전달: Claude Code TUI에서 줄바꿈/제출 구분에 필요
# (짝이 되는 terminal-features의 extkeys는 위쪽 기본 환경에서 함께 지정)
set -s extended-keys on

# 스크롤백 버퍼 대폭 확장: Claude Code의 긴 응답/로그를 거슬러 올라가며 확인 가능
set -g history-limit 100000

# 마우스 지원: 스크롤, pane 클릭 선택, 리사이즈
set -g mouse on

# 창/pane 번호 1부터 시작 (0은 손이 잘 안 감)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 자동 rename 끄기 (Claude Code 등 실행 중 창 이름이 계속 바뀌는 것 방지)
set -g allow-rename off

# 클립보드 연동 (macOS)
set -g set-clipboard on

# ── 키 바인딩: 창 / pane 관리 ───────────────────────────────
# 설정 리로드
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# 직관적인 분할 (현재 경로 유지)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 새 창도 현재 경로에서 시작
bind c new-window -c "#{pane_current_path}"

# vim 스타일 pane 이동
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+화살표로 prefix 없이 pane 이동 (Claude Code 작업 중 손 안 떼고 이동)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift+화살표로 prefix 없이 창(window) 전환
bind -n S-Left previous-window
bind -n S-Right next-window

# vim 스타일 pane 리사이즈 (연타 가능)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 창/pane 닫을 때(prefix + & / x) 확인 프롬프트는 tmux 기본 동작이라 별도 설정 불필요

# 한글 등 광폭 문자가 가끔 깨져 보일 때 pane 전환 없이 강제로 화면 다시 그리기
bind R refresh-client -S

# 명령 프롬프트(:) 진입 시 세션명 잔상과 겹치는 렌더링 문제 방지
bind : refresh-client -S \; command-prompt

# ── 복사 모드 (vi 스타일) ───────────────────────────────────
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel

# 마우스 드래그로 선택 후 자동 복사
# pbcopy로 직접 파이프하지 않고 OSC 52로 전달: SSH로 원격 접속했을 때도
# (원격엔 pbcopy가 없으므로) 로컬 터미널의 클립보드까지 복사 내용이 전달됨
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ── Claude Code 실행 편의 ───────────────────────────────────
# 세로로 넓게 Claude Code용 pane을 여는 단축키 (prefix + C)
bind C split-window -h -c "#{pane_current_path}" -l 40% "claude"

# pane 동기화 토글 (여러 pane에 동시 입력, 필요할 때만 켜기)
bind y set-window-option synchronize-panes \; display-message "sync-panes: #{?pane_synchronized,ON,OFF}"

# ── 상태바 ──────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# ── 플러그인 (tpm) ──────────────────────────────────────────
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tpm'

# ── 테마: Catppuccin (Macchiato) ────────────────────────────
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# ── 세션 자동 저장/복원 (resurrect + continuum) ────────────────
# 자동으로 매 15분마다 세션 상태 저장
set -g @continuum-save-interval '15'

# tmux 켤 때 마지막 저장된 세션 자동 복원
set -g @continuum-restore 'on'

# pane 안에서 실행 중이던 vim/nvim 상태까지 복원
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# claude code는 기본 화이트리스트에 없어 재부팅 후 재실행되지 않으므로 명시적으로 추가
set -g @resurrect-processes '"~claude->claude --continue"'

run '~/.tmux/plugins/tpm/tpm'
