# ~/.tmux.conf
# ════════════════════════════════════════════════════════════

# ── Prefix: Ctrl+b → Ctrl+a ─────────────────────────────────
set -g prefix C-a
unbind C-b

# prefix + C-a 로 리터럴 Ctrl-A 전송
bind C-a send-prefix


# ── 기본 환경 ────────────────────────────────────────────────

# tmux 내부 TERM
set -g default-terminal "tmux-256color"

# 터미널 기능
#
# xterm*:
# - clipboard : OSC 52 클립보드
# - extkeys   : Shift+Enter 등의 확장 키
# - RGB       : True Color
#
# Ghostty, Kitty 등의 TERM은 일반적으로 xterm*에 매칭된다.
#
# tmux 기본 terminal-features 항목을 유지하면서
# clipboard / extkeys / RGB를 명시적으로 활성화한다.
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys:RGB,screen*:title,rxvt*:ignorefkeys'

# Vim / Neovim / Claude Code에서 ESC 입력 지연 최소화
set -sg escape-time 10

# 반복 가능한 tmux key binding의 반복 허용 시간
set -g repeat-time 300

# 터미널 focus in/out 이벤트를 pane 프로그램에 전달
set -g focus-events on

# Shift+Enter 등의 확장 키 전달
set -s extended-keys on

# Claude Code의 긴 응답과 로그를 위한 scrollback
set -g history-limit 100000

# 마우스 스크롤 / pane 선택 / resize
set -g mouse on

# 창 / pane 번호를 1부터 시작
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 실행 프로그램에 따라 window 이름이 자동 변경되는 것 방지
set -g allow-rename off


# ── 클립보드 / 터미널 passthrough ─────────────────────────────

# tmux copy-mode
#   → OSC 52
#   → SSH
#   → 로컬 터미널
#   → 로컬 OS Clipboard
#
# external:
# - tmux 자신이 OSC 52로 외부 clipboard를 설정하는 것은 허용
# - pane 내부 프로그램이 OSC 52로 tmux buffer를 직접 변경하는 것은 차단
set -s set-clipboard external

# Claude Code 알림, terminal graphics protocol,
# yazi 이미지 등 tmux passthrough sequence 허용
set -g allow-passthrough on


# ── 키 바인딩: 창 / pane 관리 ───────────────────────────────

# 설정 리로드
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# 현재 경로를 유지하면서 pane 분할
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# 현재 경로에서 새 window 생성
bind c new-window -c "#{pane_current_path}"

# Vim 스타일 pane 이동
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + 방향키로 prefix 없이 pane 이동
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + 방향키로 prefix 없이 window 이동
bind -n S-Left previous-window
bind -n S-Right next-window

# Vim 스타일 pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 한글 / 광폭 문자 등이 깨져 보일 때 강제 redraw
bind R refresh-client -S

# command prompt 진입 전에 화면 redraw
bind : refresh-client -S \; command-prompt


# ── 복사 모드 (vi 스타일) ───────────────────────────────────

setw -g mode-keys vi

# prefix + Escape → copy mode
bind Escape copy-mode

# selection 시작
bind -T copy-mode-vi v send -X begin-selection

# selection 복사 후 copy-mode 종료
#
# set-clipboard external에 의해:
# tmux buffer → OSC 52 → 로컬 OS clipboard
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 사각형 selection
bind -T copy-mode-vi r send -X rectangle-toggle

# Enter로도 복사
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel

# 마우스 drag selection 종료 시 자동 복사
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel


# ── Claude Code 실행 편의 ───────────────────────────────────

# Claude Code용 pane
bind C split-window -h -c "#{pane_current_path}" -l 40% "claude"

# 여러 pane 동시 입력 토글
bind y set-window-option synchronize-panes \; display-message "sync-panes: #{?pane_synchronized,ON,OFF}"


# ── 상태바 ──────────────────────────────────────────────────

set -g status-interval 5


# ── 플러그인 (tpm) ──────────────────────────────────────────

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tpm'


# ── 테마: Catppuccin (Macchiato) ────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_directory_icon "  "
set -g @catppuccin_cpu_icon "  "

# Left
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"

# Right
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_uptime}"


# ── 세션 자동 저장/복원 (resurrect + continuum) ────────────────

# 자동으로 매 15분마다 세션 상태 저장
set -g @continuum-save-interval '15'

# tmux 켤 때 마지막 저장된 세션 자동 복원
set -g @continuum-restore 'on'

# pane 안에서 실행 중이던 vim/nvim 상태까지 복원
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Claude Code 복원
set -g @resurrect-processes '"~claude->claude --continue"'


# ── TPM ──────────────────────────────────────────────────────

run '~/.tmux/plugins/tpm/tpm'
